<!-- doctorDashboard.html -->
<!-- Doctor Dashboard page for managing patient records and appointments -->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />

    <!-- Stylesheets -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <!-- Utility and Render JS -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <!-- Component JS -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script th:src="@{/js/components/patientRows.js}" defer></script>

    <!-- Page-specific JS -->
    <script type="module" th:src="@{/js/services/patientServices.js}" defer></script>
    <script type="module" th:src="@{/js/services/doctorDashboard.js}" defer></script>
</head>
<body onload="renderContent()">
    <div class="container">
        <div class="wrapper">
            <!-- Header -->
            <div id="header"></div>

            <!-- Main Dashboard -->
            <main class="main-content">
                <h2>Doctor Dashboard</h2>

                <!-- Search and Filters -->
                <div class="controls">
                    <input type="text" id="searchBar" class="searchBar" placeholder="Search by patient name or ID" />

                    <button id="todayButton" class="today-btn">Today's Appointments</button>

                    <input type="date" id="datePicker" class="date-picker" />
                </div>

                <!-- Patient Records Table -->
                <table id="patientTable">
                    <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Phone No.</th>
                            <th>Email</th>
                            <th>Prescription</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <!-- Dynamic rows injected via patientRows.js / patientServices.js -->
                    </tbody>
                </table>

                <div class="noPatientRecord" id="noPatientRecord" style="display:none;">
                    No patient records found.
                </div>
            </main>

            <!-- Footer -->
            <div id="footer"></div>
        </div>
    </div>
</body>
</html>
